name: "Update dsh"
on:
  schedule:
    # Daily; dsh is in developer preview and releases often
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Run update script
        run: nix develop -c ./scripts/update.sh

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Already up to date"
            exit 0
          fi
          version=$(sed -n 's/^ *version = "\([^"]*\)";/\1/p' package.nix | head -1)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.nix package-lock.json
          git commit -s -m "chore: update dsh to $version"
          git push
