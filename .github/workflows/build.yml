name: "Build and Cache"
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_run:
    workflows: ["Update dsh"]
    types:
      - completed
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Only run if not triggered by workflow_run or if the workflow succeeded
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

    - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      with:
        name: chinrw
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        # Fork PRs have no token; the action still configures read-only substitution.
        skipPush: ${{ github.ref != 'refs/heads/main' }}

    - name: Build deepseek-harness
      run: nix build .#deepseek-harness -o result --print-build-logs

    - name: Push to Cachix
      if: github.ref == 'refs/heads/main'
      run: nix build .#deepseek-harness --json | jq -r '.[].outputs.out' | cachix push chinrw

    - name: Test dsh
      run: ./result/bin/dsh --version
